version: "3"

services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html
    restart: always

  api:
    image: alpine:latest
    command: /bin/sh -c "while true; do echo 'API running'; sleep 10; done"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
    depends_on:
      - web

  db:
    image: alpine:latest
    command: ["/bin/sh", "-c", "echo 'DB started' && sleep infinity"]
    volumes:
      - dbdata:/data

volumes:
  dbdata:
